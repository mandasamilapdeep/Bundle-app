# fly.toml app configuration file generated for ms-bundle-discount on 2026-11-20T15:22:02+05:30
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ms-bundle-discount'
primary_region = 'sin'

[build]
[env]
  PORT = '3000'
  SCOPES = 'read_discounts,write_discounts,write_metaobject_definitions,write_metaobjects,write_products'
  SHOPIFY_API_KEY = '018b6c1d071f93559109f85c0b738fcc'
  SHOPIFY_APP_URL = 'https://ms-bundle-discount.fly.dev'

[processes]
  app = 'node ./dbsetup.js npm run docker-start'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
